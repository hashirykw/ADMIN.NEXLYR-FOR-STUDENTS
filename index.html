<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1220">
<title>Nexlyr for Students · Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/report.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<!-- sign in -->
<main class="login" id="login" hidden>
  <form class="panel form login-card" id="loginForm" novalidate>
    <img class="login-logo" src="/assets/img/nexlyr-logo.svg" alt="Nexlyr Solutions" width="50" height="80">
    <div><h1>Nexlyr for Students</h1><p class="muted">Admin and teacher panel</p></div>
    <div class="field"><label for="lEmail">Email</label><input class="input" id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Password</label><input class="input" id="lPass" type="password" autocomplete="current-password" required></div>
    <p class="note note-bad" id="lErr" hidden></p>
    <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
    <div class="preview-roles" id="previewRoles" hidden>
      <p class="hint">Preview mode: no database connected yet. Look around as</p>
      <div class="row"><button class="btn btn-line btn-sm" type="button" data-preview="admin">Admin</button><button class="btn btn-line btn-sm" type="button" data-preview="teacher">Teacher</button></div>
    </div>
  </form>
</main>

<!-- app -->
<div class="shell" id="shell" hidden>
  <aside class="rail" id="rail">
    <a class="rail-brand" href="#overview"><img src="/assets/img/nexlyr-logo.svg" alt="Nexlyr Solutions" width="22" height="35"><span>for Students<small id="roleLabel">Admin</small></span></a>
    <nav class="rail-nav" id="railNav" aria-label="Sections"></nav>
    <div class="rail-foot">
      <div class="rail-me"><b id="meName">—</b><small id="meMail"></small></div>
      <button class="btn btn-ghost btn-sm" type="button" id="signOut">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="btn btn-line btn-icon rail-toggle" type="button" id="railToggle" aria-label="Open menu" aria-expanded="false" aria-controls="rail">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <h1 class="view-title" id="viewTitle">Overview</h1>
      <div class="row topbar-actions">
        <a class="btn btn-ghost btn-sm" id="siteLink" href="#" target="_blank" rel="noopener">Student site ↗</a>
        <button class="btn btn-line btn-icon bell" type="button" id="bell" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><b class="bell-n" id="bellN" hidden>0</b></button>
      </div>
    </header>
    <div class="bell-panel panel" id="bellPanel" hidden><div class="row between"><b>Notifications</b><button class="link" type="button" id="bellRead">Mark all read</button></div><ul id="bellList"></ul></div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- shared modal -->
<div class="modal" id="m" aria-hidden="true" role="dialog" aria-labelledby="mTitle">
  <div class="modal-card" id="mCard">
    <div class="modal-head"><div><h2 class="m-title" id="mTitle"></h2><p class="muted" id="mSub"></p></div><button class="btn btn-ghost btn-icon modal-x" data-close aria-label="Close">✕</button></div>
    <div id="mBody"></div>
  </div>
</div>

<script defer src="/assets/js/config.js"></script>
<script defer src="/assets/js/vendor/supabase.js"></script>
<script defer src="/assets/js/demo-data.js"></script>
<script defer src="/assets/js/admin-core.js"></script>
<script defer src="/assets/js/report.js"></script>
<script defer src="/assets/js/admin-views.js"></script>
<script defer src="/assets/js/teacher-views.js"></script>
<script defer src="/assets/js/admin-app.js"></script>
</body>
</html>
